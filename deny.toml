[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
# RUSTSEC ids and yanked crates that cannot be upgraded yet. Not a lint-level downgrade.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    # jsonschema
    "MIT-0",
    # encoding_rs, through jsonschema
    "BSD-3-Clause",
    # foldhash
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies carry no version; wildcards stay denied for the rest.
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "openssl", reason = "TLS is rustls" },
    { crate = "native-tls", reason = "TLS is rustls" },
]
skip = [
    { crate = "syn@2", reason = "garde_derive 0.23.0, rstest_macros 0.28.0 and strum_macros 0.28.0, their latest releases, require syn 2" },
]

# Declarations repeated outside [workspace.dependencies], and unused entries.
[bans.workspace-dependencies]
duplicates = "deny"
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
