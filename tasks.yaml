  - id: QCTL-002
    title: A mutation rewrites the lines it changes, not the file
    scope: qctl
    outcome: >-
      add, start, and archive change only the bytes they must, so a ledger
      edit is reviewable as a diff, two people can edit different rows
      without conflicting, and the file still reads the way it was written.
    notes: >-
      2026-08-18, measured on the real thing rather than assumed. One
      `qctl start VER-020` against a copy of verctl's 427-line tasks.yaml
      changed 641 lines — every line in the file — and stretched the longest
      line from 153 to 2158 characters. Six distinct losses, all from the
      same cause: mutate.rs parses to serde_yml `Value`, which keeps values
      and drops everything else, then serializes from scratch. Gone are
      comments (line 1 `# yaml-language-server: $schema=…` included), blank
      lines between rows, two-space sequence indentation, folded `>-`
      scalars (flattened to single long lines), double quotes (rewritten to
      single), and inline flow sequences (expanded to block lists). The
      values themselves survive — `check` still passes on the output — so
      this is entirely a writer problem, not a schema one.
      The shortest demonstration needs two commands and no existing file:
      `qctl init` writes the `# yaml-language-server:` header, and the first
      `qctl add` deletes it. The tool destroys its own output on the first
      verb after creating it.
      Why it matters beyond taste: a whole-file diff cannot be reviewed, and
      two people editing different rows conflict on every line. It also
      blocks verctl VER-021, which installs a `$schema` line in every ctl
      repo that qctl would delete on the next verb.
      Until this ships, a comment in a ledger does not survive the next verb,
      so nothing belongs beside a key that could live in notes instead.
      The writer, chosen against the alternatives rather than assumed:
      yamlpath + yamlpatch (zizmor's crates, MIT, 460k and 236k downloads,
      tree-sitter-yaml spans and comment-preserving patch ops). Rust has no
      mature toml_edit equivalent for YAML, so the field was searched and
      each candidate tried against the real ledger.
      Rejected, with the reason each was rejected. yaml-edit 0.2.3 (rowan
      lossless CST, the closest analogue on paper) reported this repo's
      seven-row queue as three rows, so remove-then-insert silently did
      nothing, and it dropped the `# yaml-language-server:` line — the exact
      byte the task exists to protect. yaml-rt, edikt-yaml, yaml-serde-edit
      and fyaml all describe the right thing, including a typed-overlay
      writer, but were published weeks ago and have double- to
      triple-digit downloads; this tool is a dependency of every ledger in
      the workspace. rust-yaml has adoption but no span or patch API.
      Two gaps in the chosen pair are ours to close, both measured.
      One: tree-sitter attributes a comment to the row *above* it, so
      `removal_span` on a row swallows the next row's leading comment while
      excluding its own. Reordering therefore takes the item's own span from
      `query_exact` and applies one attribution rule of our own — a comment
      line directly above a row, with no blank line between, belongs to that
      row — with the parser still deciding what is a comment. YAML has no
      formal comment ownership, so every round-tripping library invents this
      rule; ruamel.yaml included.
      Two: `Op::Append` refuses a flow sequence, so `add` on a
      freshly initialized ledger (`queue: []`) needs its own path.
      Verified for the writer, so it does not have to be discovered mid-build:
      the queued row type serializes into that value type with its absent
      fields skipped, so a generated row carries no `patch: null` and no empty
      `links`, and the serializer quotes what needs quoting.
      Two defects this verb rewrite also owns. A blocker resolves against the
      queue alone, so archiving an id leaves every row that named it failing
      `check` with "is not queued" — the verb has to drop the archived id from
      the rows that named it, which is also why every blocked row in this
      ledger would otherwise break the moment its blocker ships. And `archive`
      is the one verb that never loads the ledger before editing it, so it
      alone will edit a file whose values do not pass.
      Also known and accepted: a generated row's nested sequence items come
      out at the serializer's indentation, one level shallower than the
      hand-written rows. That applies only to rows with no prior formatting
      to preserve.
    completed: 2026-08-18T23:00:41
    evidence:
      - 'qctl PR #15'
