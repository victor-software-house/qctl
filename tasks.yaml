# yaml-language-server: $schema=./schema/tasks.schema.json
schema_version: 3
prefix: QCTL

style:
  timezone: "-03:00"
  section_order: [queue, horizon, archive]
active: QCTL-006

queue:
  - id: QCTL-006
    title: Archive from commit trailers in a pre-push hook
    scope: qctl
    outcome: >-
      A merged or pushed commit that closes a ledger id archives that
      row. An active id cannot sit on main after its close trailer landed.
    blocked_by: []
    acceptance:
      - "Trailers Closes PREFIX-NNN and Completes: PREFIX-NNN in the commit body are the only syntax. Subject-line slogans do not count."
      - "qctl hook install writes a pre-push (and optional commit-msg) hook that runs qctl close-from-git."
      - "qctl close-from-git reads commits being pushed (or main..HEAD), archives matching queued ids with evidence = the commit SHA, and fails if active still names a closed id."
      - "CI qctl check on default branch fails when a commit already on that branch closed an id that is still queued."
      - "The hook does not amend. It writes tasks.yaml in the working tree and requires that file to be part of the push (or a follow-up commit). No hook skip flags."
      - "Does not invent GitHub issue linking. Closes #12 stays GitHub's."
    notes: >-
      check now fails if a Closes/Completes trailer names a still-queued
      id. Auto-archive of tasks.yaml still needs QCTL-002. VER-003 went
      stale because check did not look at git and no commit had a trailer.

  - id: QCTL-008
    title: Adopt ctl-core in qctl and forkctl
    scope: cross-repo
    outcome: >-
      qctl and forkctl flatten ctl-core flags and go()/View::show.
      No third copy of styled help, color, or format.
    blocked_by: []
    acceptance:
      - qctl main uses ctl_core::prelude (go, OutputArgs or ColorLong, formatdoc).
      - forkctl drops its local help/color/format chassis in favor of ctl-core.
      - state-sync is a follow-up or the same PR if the diff stays small.
      - Pin is a ctl-core git rev or crates.io version, not a path dep on main.
    notes: >-
      Blocked in practice on ctl-core CTC-004 (harden). qctl cannot
      name a foreign prefix in blocked_by. Do not wait for QCTL-001.

  - id: QCTL-014
    title: Let a ledger declare whether rows are blank-separated
    scope: qctl
    outcome: fmt keeps one blank line between rows when the style asks for it, so a lost separator is repaired rather than found by eye.
    blocked_by: []
    acceptance:
      - A style option decides whether rows in a list are separated by exactly one blank line, defaulting to leaving them as written.
      - With it on, fmt inserts a missing separator and removes a doubled one; the first row of a list never gets one above it.
      - The two separators repaired by hand in QCTL-013 would have been fixed by running fmt.
    patch: blank-between-rows

  - id: QCTL-015
    title: Write a ledger atomically so a crash cannot truncate it
    scope: qctl
    outcome: A verb that dies mid-write leaves the ledger as it was, not half of it. The file is written beside itself and renamed over the original, so a reader sees one version or the other.
    blocked_by: []
    acceptance:
      - Every write goes through a temp file in the ledger's own directory, then a rename.
      - A test proves the original survives when the write fails after the temp file exists.
      - No verb calls fs::write on the ledger path.

  - id: QCTL-016
    title: Name the next row a ledger can actually start
    scope: qctl
    outcome: 'qctl answers what to work on next, instead of a human reading status and applying blocked_by in their head. One ledger first: the earliest queued row whose blockers are all archived.'
    blocked_by: []
    acceptance:
      - qctl next prints one id, or says why nothing is startable — every queued row blocked, or the queue empty.
      - It agrees with active when active is set and startable, and disagrees loudly when active names a row whose blockers are still queued.
      - A scenario in tests/fixtures covers a queue whose head is blocked and whose second row is not.

  - id: QCTL-017
    title: Decide whether a served include pins a tag or a commit
    scope: cross-repo
    outcome: Every consumer's task include names the same kind of ref, on purpose, and the reason is written down where the include is generated.
    blocked_by: []
    acceptance:
      - 'The decision is recorded in docs/served-files terms: a tag is ours and never moved, or a SHA because a tag can be.'
      - If SHAs win, the served-file template renders the tag's commit and every consumer moves in the same slice.
      - If tags win, the reasoning is in the repo, so the next review that raises it is answered by a link rather than an argument.

  - id: QCTL-018
    title: Stop the example catalog declaring a second qctl pin
    scope: qctl
    outcome: 'examples/mise.toml shows the shape consumers actually use: the include alone, with the served task carrying the version.'
    blocked_by: []
    acceptance:
      - "The mise.toml template drops its [tools] entry, and the rendered comment says the include ref is the only pin — whatever kind of ref QCTL-017 settles on."
      - README says the same thing.

  - id: QCTL-020
    title: Let a row wait on work in another ledger
    scope: qctl
    outcome: A blocked_by entry may name a foreign prefix, and check treats it as a dependency it deliberately cannot resolve rather than an error. No registry, no sources — the dependency is data, and this is the half that is.
    blocked_by: []
    acceptance:
      - A foreign prefix in blocked_by passes check, and status shows the row as blocked with the foreign id named.
      - A same-prefix id that does not exist still fails, exactly as it does today.
      - status says which foreign ids a row waits on, without claiming to know whether they are done.
      - 'qctl instructions states the rule: a foreign prefix is recorded, never resolved, until QCTL-019 decides how resolution works.'
      - "Which prefixes a ledger may name is declared in tasks.yaml, beside the rows — it is data about the work, so this phase adds no second file."

  - id: QCTL-021
    title: Style says how a scalar is quoted
    scope: qctl
    outcome: >-
      A ledger declares its quoting the way it declares its indent, so one
      file writes one fact one way whoever wrote the row.
    blocked_by: []
    acceptance:
      - "`style` carries the option, defaulting to what the serializer does today, so an existing ledger is unchanged until it asks."
      - "`fmt` rewrites a scalar that disagrees with the declared style, and `fmt --check` fails it, so a mix cannot survive a hook."
      - Every writer honours it, so a row a verb writes and a row fmt rewrites come out identical.
      - A test asserts the shape on a written row rather than on a hand-built string.
    notes: >-
      2026-08-19, raised on verctl#46 and corrected here after reading the
      code rather than the symptom. The first write-up called this qctl
      disagreeing with itself. It is not: every stamp qctl has ever written is
      unquoted, because `yaml_serde`'s emitter decides, and CTC's writer row
      already stated that intent — "the serializer quotes what needs quoting".
      The mix in verctl's ledger came from a foreign writer, the QCTL-011
      recovery script, which wrote `completed: "…"` as literal text.
      So the gap is a missing option, not a bug, and the code already says so:
      `format.rs` names "row key order and quote style" as the obvious next
      options, deliberately not decided, and `document.rs` disclaims deciding
      "how to quote a value". `style` has five options — timezone,
      section_order, indent, archive_order, normalize_on_write — and none is
      about scalar style. `check` cannot see quoting at all, because it
      validates the parsed value, where both forms are the same String.
      Nothing is broken today: every reader we ship takes an unquoted ISO-8601
      scalar as a string. The risk is a reader that does not — a YAML 1.1
      resolver takes it as a timestamp node while the `$schema` line says
      string. Do this with row key order, since format.rs pairs them, and
      leave the default at today's behaviour so no ledger moves unasked.

  - id: QCTL-022
    title: The bundled skill says which release it describes
    scope: qctl
    outcome: A reader can tell whether skills/qctl/SKILL.md predates the qctl they hold, without leaving the file.
    blocked_by: []
    acceptance:
      - 'skills/qctl/SKILL.md carries version: in its frontmatter, and the Version PR moves it with every other version site.'
      - 'It is a patterns pin, not a template: the skill is hand-authored prose and a template would own the whole document.'
      - 'The arity is once, so a second version: line stops the release instead of rewriting the wrong one.'
      - The vendored copy in the global skill set shows the released version, checked after the release rather than assumed.
    notes: >-
      2026-08-20, from the bundle contract written down as the
      `ctl-bundle-contract` skill (dotfiles b944acf9). A ctl CLI ships a usage
      skill, an installed instruction sheet and docs beside the binary, and the
      skill is vendored into the global set at `latest-release` — so the text a
      consumer loads is a released snapshot they cannot date from the outside.
      verctl did it first in verctl#50 and that is the shape to copy: a
      `patterns` entry matching `version: {version}` at arity `once`, plus a
      `pins` entry naming `skills/qctl/SKILL.md`. Not a template — the served
      files doc reaches for a template only when a file can be generated, and a
      skill is prose. Confirm no other `version: ` line exists in the document
      first, since the match is literal and the arity would fail the release.

  - id: QCTL-023
    title: check says which rules it enforces
    scope: qctl
    outcome: A consumer deleting a hand-rolled validator can prove qctl covers it by reading a published inventory, instead of building defect fixtures for an hour.
    blocked_by: []
    acceptance:
      - check --explain prints every rule, its exact message, and which lists it reads, then exits 0.
      - The inventory is machine-readable, so a consumer can diff it against their own rule set.
      - It is generated from the checks themselves, so it cannot drift from them.
    notes: >-
      pi-stuff adoption report, ask 9 — they call it the cheapest item on their
      whole list and the most valuable for adoption, because it is a document
      rather than code. They proved `check` subsumes their 209 lines of Rego
      and Bun policy by writing ten defect ledgers by hand, one per rule, and
      running each through `qctl check --no-git`. All seven of their Rego deny
      rules and both halves of their script matched, and qctl was strictly
      wider: their script read queue and archive only, so a horizon row's
      `plan:` went unchecked. Their point is that the hour they spent is the
      hour every migrating consumer faces, and most will skip it and either
      keep both validators forever or delete on faith. `qctl check --help` at
      HEAD offers only --file and --no-git.

  - id: QCTL-024
    title: Horizon has verbs, so a row is not hand-edited into place
    scope: qctl
    outcome: Moving a row between horizon and queue is one command that respects the invariants, not four hand edits.
    blocked_by: []
    acceptance:
      - park writes a horizon row from title, scope, outcome, kind and open.
      - promote moves a horizon row to the queue, dropping kind and open and taking acceptance and any blockers.
      - promote respects the active invariant and refuses rather than corrupting it.
      - instructions.md no longer tells a reader that horizon is edited in the yaml.
    notes: >-
      pi-stuff adoption report, ask 7. instructions.md is already upfront that
      horizon is edited by hand until these verbs exist; they hit it on day
      one, and the hand edit is the thing the same document tells agents not to
      do. Worth keeping from their write-up: they call the HorizonTask schema
      shape *good* and ask us not to change it. Having no acceptance and no
      blocked_by mechanically forced them to split one vague request into a
      queue row with provable acceptance and a horizon row with a named
      blocker, which they say they would not have split as cleanly on
      judgement alone. promote is the verb that matters more than park:
      horizon to queue is four hand edits with the active invariant to respect.

  - id: QCTL-025
    title: add writes the row you meant, where you meant it
    scope: qctl
    outcome: A row added by the verb needs no hand edit afterwards, and lands where its priority says.
    blocked_by: []
    acceptance:
      - add takes notes, blocked_by (repeatable), plan and link (repeatable).
      - add --after ID and --before ID place the row; the tail stays the default.
      - A blocker that is not an earlier queued id is refused.
      - add --horizon writes a horizon row through the same verb.
    notes: >-
      pi-stuff adoption report, asks 8 and 2.6, filed together because both are
      the same verb falling short of the schema. `AddArgs` (src/cli.rs:85) is
      title, scope, outcome, acceptance and patch; QueuedTask also has notes,
      blocked_by, plan and links. Every row they added needed a hand edit
      straight after `add`, always for notes, which is where their conventions
      put the evidence — so the verb bought them the id and the placement and
      they edited the file anyway. blocked_by is safe to accept even though it
      carries an invariant: a blocker must be an earlier queued id, and `add`
      appends to the tail, so any existing queued id qualifies. Placement is
      the other half: queue order is priority, so anything urgent means a hand
      edit or an immediate `start`, which forces it to the head and makes it
      active — usually wrong. Confirmed here while filing this very row: seven
      rows added, seven notes hand-edited in afterwards.

  - id: QCTL-026
    title: A check that cannot run says so instead of passing
    scope: qctl
    outcome: No qctl gate reports success by having skipped itself.
    blocked_by: []
    acceptance:
      - trailer_errors says so when closed_ids fails, instead of returning no errors.
      - The scan is skipped, and says it was, when the ledger resolves outside the repository that surrounds the cwd.
      - A test proves the silence is gone.
    notes: >-
      pi-stuff adoption report, §2.8. `trailer_errors` (src/check.rs:50) does
      `let Ok(closed) = trailers::closed_ids(root) else { return Vec::new() }`
      — an environment where the git call fails drops a whole check class and
      the run passes quietly. The discoverability half is the same shape from
      the operator's side: validating a ledger that lives outside the current
      repository — a fixture, a scratch copy, a migration staging file — runs
      the trailer scan against whatever repo surrounds it, and nothing points
      at --no-git until the odd complaints start. verctl carries the same law
      as VER-036, for `expand` and `prove_default_history`.

  - id: QCTL-027
    title: One problem is reported once
    scope: qctl
    outcome: A ledger with ten problems prints ten lines, each readable in a terminal.
    blocked_by: []
    acceptance:
      - check prints one line per problem and a bail that counts them, not both.
      - The --no-git help text names the scratch-file case that makes it necessary.
    notes: >-
      pi-stuff adoption report, §2.7. src/check.rs:40 prints each problem on
      its own line, then line 42 bails with all of them joined — twenty lines
      for ten facts, and the joined form is the one that wraps badly. Keep the
      per-line output and reduce the bail to the count and the path.

  - id: QCTL-028
    title: The example catalog shows a whole row of each kind
    scope: qctl
    outcome: Somebody writing a row by hand copies a populated example instead of learning the schema from error messages.
    blocked_by: []
    acceptance:
      - examples/tasks.yaml carries one maximal QueuedTask, one ArchivedTask and one HorizonTask.
      - A test parses it, so it cannot drift from the types.
    notes: >-
      pi-stuff adoption report, §2.9. Writing their first horizon row by hand,
      their first attempt used `evidence: Shipped.` on an archive fixture. The
      error was good and specific — `/archive/0/evidence: "Shipped." is not of
      type "array"` — but they found it by trial. `qctl init` writes an empty
      ledger, and examples/ at HEAD holds only mise.toml. They name verctl's
      examples/ver.yaml plus tests/examples.rs as the pattern to copy and call
      it the best thing in verctl's documentation. Distinct from QCTL-018,
      which is about the catalog declaring a second qctl pin.

  - id: QCTL-029
    title: status and check speak JSON
    scope: qctl
    outcome: An agent reads the ledger state without parsing a table that is free to change shape.
    blocked_by: []
    acceptance:
      - A --format json option on status and check, matching how verctl spells it.
      - check exits non-zero with a JSON array of problems.
    notes: >-
      pi-stuff adoption report, ask 10. They read status and check with agents
      far more often than with humans. This is qctl-only: verctl already has a
      global --format json, measured at HEAD on status, check, ci and assets —
      and `git show v0.1.1:src/cli.rs` carries `FormatArgs` too, so it was
      already there in the release they read and they missed it rather than
      reading an old tool. Which is itself the argument for QCTL-023: a feature
      nobody can find is a feature nobody has. Spell it the way verctl does, so
      one convention covers the family.

horizon:
  - id: QCTL-019
    title: Resolve a foreign blocker instead of only recording it
    scope: qctl
    kind: evaluation
    open: >-
      QCTL-020 lets a row say it waits on VER-025 and stops there, on purpose.
      Reading that row — is it archived yet — means fetching another repository
      at a pinned ref. Is that worth building, and is a stale answer from a pin
      better than no answer?
    outcome: >-
      A decision, written down, on what a source is, where it is declared, and
      what reading one costs.
    notes: >-
      2026-08-19, from migrating ctl-core, verctl, kodus-ai and pi-stuff by
      hand in one pass. What the pass actually taught:
      Cross-repo order is real and invisible. QCTL-003 waited on QCTL-009 in the
      same ledger and that was easy to see; verctl VER-025 will rewrite the
      config this repo just gained, and nothing anywhere records that. A foreign
      blocked_by is the first thing worth having.
      Prefixes already carry the repository. QCTL-, VER-, CTC-, KAI-, PST-,
      CCS- are unique across the six, and this ledger already reserves the rule
      that a foreign prefix in blocked_by is not waited on.
      2026-08-19, read from pi's parser rather than its docs
      (packages/coding-agent/src/utils/git.ts): a git source there is always a
      whole repository. `buildGitSource` refuses a path that is not exactly
      user/project, the hosted branch builds it as `${info.user}/${info.project}`,
      and `GitSource` carries no subdirectory at all — selection inside a package
      is done by globs in its own package.json. Protocol is gated deliberately:
      without a `git:` prefix the string must match `^(https?|ssh|git)://`, and
      the prefix is what buys the shorthands `git:github.com/user/repo` and
      `git:git@github.com:user/repo`. A ref is `@ref`, with `#committish` also
      parsed, and `pinned` is simply whether one was given.
      So pi is the wrong donor for the path half. A ledger is a file inside a
      repository, and the syntax that says protocol, subpath, and ref at once is
      the go-getter form this repo's own task includes already use:
      `git::https://github.com/o/r.git//tasks/q?ref=v0.1.2`.
      2026-08-19, decided by Victor: a source is structured fields, not a URI.
      `repo` is parsed by gix-url — https, ssh, scp-like and file all parse, and
      its Scheme carries the protocol distinction pi spends a prefix on — with
      `dir` and `ref` beside it. gix-url derives serde, so the config
      deserializes without a line of parsing. The shorter-syntax question
      dissolves rather than being answered: a URI is long because it packs four
      facts into one string, and packing them is also what forces a parser we
      would then own. PURL was the runner-up — the only one-string form with a
      real spec and a maintained crate (packageurl 0.7.0, `#subpath` first
      class) — and it loses on exactly the protocol point, because ssh and
      self-hosted are qualifiers there, not types.
      Decided with it: resolution reads a pinned ref, never a checkout. A working
      tree can be dirty, on a branch, or behind, so reading one would reintroduce
      the drift a pin exists to remove. A foreign row's state is its state at the
      ref this repo names.
      Where it goes: `.ctl/q.yaml`, settled on verctl VER-025 where the name was
      being chosen — one `.ctl/` directory, one file per tool, named after the
      task an operator runs rather than the crate that reads it, with served-file
      templates shared at `.ctl/templates/`.
      What anything local does earn, and it is not a registry: caching. A
      user-level SQLite store keyed by the exact commit SHA a ref resolved to —
      pinned to the SHA, not the ref, so it can never answer for a tag that
      moved, and so two repos naming the same commit read it once. That is the
      cache side of the line below, and the only local state this design wants.
      One red line, so it does not get relitigated: a database may be a derived
      cache and never the authority. The record reviews as a diff and orders by
      file position, and both are gone the moment rows live in SQLite. An index
      rebuilt from the files costs nothing, because deleting it changes no
      answer.

archive:
  - id: QCTL-004
    title: Point consumers at qctl check instead of copied Ajv tests
    scope: cross-repo
    outcome: >-
      OMX seed, then kodus and pi-stuff, call qctl check. Copied
      test/tasks-ledger.test.ts files can die once the pin is real.
    notes: >-
      2026-08-19: three of four lines are met. kodus-ai#1 deleted the vendored
      tasks.schema.json and the Ajv spec, pi-stuff#94 deleted the copied schema
      and the check-jsonschema tool that only existed to run it, and both now
      gate on `q check` from `?ref=v0.1.2`; ctl-core#9 and verctl#41 moved their
      $schema URLs to the same release. What is left is
      claude-code-source-recovery, whose change is open as #18 and deliberately
      not merged by us — that ledger churns, so the PR carries the recipe to
      regenerate rather than a rebase.
      The ompex/oh-my-pi line needs a decision rather than work: QCTL-011
      settled that the two ledgers under ~/workspace/omp are not ours, which
      contradicts this line. Either that seed is a different thing than those
      ledgers, or the line should go.
    completed: 2026-08-19T22:24:32
    evidence:
      - 'kodus-ai#1 deleted the vendored tasks.schema.json and its Ajv spec; pi-stuff#94 deleted the copied schema and the check-jsonschema tool that only ran it, keeping Conftest for its own graph policy and plan-path rule. Both now gate on q check from ?ref=v0.1.2. ctl-core#9, verctl#41 and claude-code-source-recovery#18 moved their $schema URLs to that release. No owned consumer vendors a schema or an Ajv test. The ompex line was dropped rather than met: that repo is not ours.'
    disposition: completed

  - id: QCTL-011
    title: Migrate the five other owned ledgers to schema 3
    scope: workspace
    outcome: Every ledger under this operator's own repositories declares schema_version 3, stamps completion with a moment, and declares the zone that moment is in.
    notes: >-
      2026-08-19: four of five migrated — ctl-core#9, verctl#41, kodus-ai#1 and
      pi-stuff#94, each with a style block naming -03:00 and every archived row
      carrying an instant recovered from git. claude-code-source-recovery is
      open as #18 and is ours to leave alone; its stamps were placeholders
      reading 12:00:00, now real instants in that PR.
      Two corrections to this row's own wording, both learned by doing it. The
      moment is the commit in which a row **last** entered the archive, not the
      first: pi-stuff had three rows archived, re-queued, and archived again,
      and the first commit dates a stay that ended. And the day gate cannot be
      absolute — PST-051, PST-052 and PST-056 entered the archive at 00:21 on
      2026-08-18 while the row said 2026-08-17, the day the work finished. The
      commit instant is what `completed` means, so those three were accepted by
      name rather than by loosening the rule for everything.
    completed: 2026-08-19T22:24:20
    evidence:
      - 'All six owned ledgers speak schema 3: ctl-core#9, verctl#41, kodus-ai#1, pi-stuff#94 and claude-code-source-recovery#18, each with a style block naming -03:00 and every archived row carrying the instant it last entered the archive, recovered from git. 88 rows across five repos; the day gate held everywhere except PST-051, PST-052 and PST-056, which entered the archive at 00:21 and were accepted by name. The two ompex ledgers under ~/workspace/omp were left alone.'
    disposition: completed

  - id: QCTL-003
    title: "Publish native qctl so mise github: can install it"
    scope: release
    outcome: >-
      A tagged release ships darwin-arm64 and linux-x64 binaries. The
      tasks/q catalog pin is a real immutable ref.
    notes: >-
      2026-08-17: the lane exists — CI, Version PR, publish, and both
      tarballs, all through released verctl, same shape as ctl-core.
      0.0.1 was cut by hand from this workstation, which is why it
      shipped macos-arm64 only.
      2026-08-18: 0.0.2's first Version PR bumped Cargo.toml and left
      Cargo.lock at 0.0.1, so Verify's `cargo package --locked` hit a dirty
      tree. Fixed by declaring `[prepare]` here and moving to verctl 0.0.3,
      which is the release that commits `[prepare].stage` files. The nscloud
      note is withdrawn, not deferred: this repo is public, so
      macos-latest/ubuntu-latest are the runners it wants, and verctl 0.0.3
      makes them a default rather than a hardcoded map.
      2026-08-19, corrected: 0.0.2 did ship after that fix. Its release
      carries qctl_0.0.2_linux_x64.tar.gz and qctl_0.0.2_macos_arm64.tar.gz
      alongside tasks.schema.json, so the first acceptance line is already
      met and the earlier "never shipped" note was stale. What is left is
      proving a clean consumer can install and check against a real tag.
      examples/mise.toml does exist, and said `?ref=v0.0.1` — correcting that
      is QCTL-009's subject, which is why this row now waits on it: a tag
      whose task file installs 0.0.1 cannot prove the last line.
    completed: 2026-08-19T16:12:33
    evidence:
      - v0.1.1 ships qctl_0.1.1_macos_arm64.tar.gz and qctl_0.1.1_linux_x64.tar.gz, examples/mise.toml at that tag pins 0.1.1, and a scratch consumer holding only that file ran mise install, then mise run q -- init and check ok against qctl 0.1.1 fetched from the tagged include.
    disposition: completed

  - id: QCTL-009
    title: Declare this repo's served files so its tag stops lying
    scope: qctl
    outcome: >-
      Every ref a consumer fetches out of a qctl tag names that tag's
      version, without anybody bumping five files by hand.
    notes: >-
      2026-08-18, verified against the published tag: `git show
      v0.0.2:tasks/q/q` still says `"github:…/qctl" = "0.0.1"`, and
      examples/mise.toml and README in that tree say `?ref=v0.0.1`. So the
      current release ships a task file that installs the previous release —
      the exact failure verctl VER-017/VER-018 were built to end, live in this
      repo's latest tag. Five sites, counted: the [tools] pin and the ?ref= in
      examples/mise.toml, the `#MISE tools` header at tasks/q/q line 5, and
      the ?ref= plus the install hint in README. They were hand-bumped once as
      a bridge and drifted again, which is the argument for declaring them
