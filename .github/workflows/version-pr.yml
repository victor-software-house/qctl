name: Version PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # `dev` for the toolchain prepare.after needs, `release` for the verctl
  # tarball that runs it. Not `dev` alone: verctl is not built from this repo.
  MISE_ENV: dev,release

concurrency:
  group: version-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.2
          cache: true
      - run: mise install --locked
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: qctl-verify
          save-if: false
      - uses: victor-software-house/verctl/actions/version-pr@c9f41e8df9746ad240cf59bc18626c0d938c7662 # v0.2.3
