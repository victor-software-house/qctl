name: Release

# verctl's reusable release workflow, on every push to main and on demand.
# It plans every version commit not yet fully released and publishes each at
# that commit, whatever main's HEAD is now, builds the tarballs its Release
# lacks (the linux-x64 build also attaches the ledger schema), then opens or
# updates the Version PR on verctl/release/main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: write # tags, Releases, assets, and verctl/release/main without the App
      pull-requests: write # the Version PR without the App
    uses: victor-software-house/verctl/.github/workflows/release.yml@cfc455ec4f2a93b591f84f788277af99cb1c1d90 # v0.5.0
    with:
      mise-version: 2026.10.9
      mise-env: ci,release
      auto-merge: true
    # The App token opens the Version PR so that its CI starts; a PR opened
    # with GITHUB_TOKEN starts no workflow.
    secrets:
      app-client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
      registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
