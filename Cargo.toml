[package]
name = "qctl"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
description = "Control in-repo YAML work queues"
license = "MIT"
repository = "https://github.com/victor-software-house/qctl"
homepage = "https://github.com/victor-software-house/qctl"
readme = "README.md"
keywords = ["tasks", "ledger", "yaml", "cli"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.5", features = ["derive", "env"] }
garde = { version = "0.23.0", features = ["derive", "regex"] }
jsonschema = { version = "0.49.9", default-features = false }
regex = "1.13.1"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yml = "0.0.12"
time = { version = "0.3.44", features = ["formatting", "macros", "parsing"] }
yaml_serde = "0.10"
yamlpatch = "1.29.0"
yamlpath = "1.29.0"

[dev-dependencies]
indoc = "2.0.7"
insta = { version = "1.48.0", features = ["filters"] }
rstest = "0.26.1"
shlex = "2.0.1"
similar = "3.2.0"
tempfile = "3.23.0"
time = { version = "0.3.44", features = ["macros", "parsing"] }
