[package]
name = "qctl"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "Control in-repo YAML work queues"
license = "MIT"
repository = "https://github.com/victor-software-house/qctl"
homepage = "https://github.com/victor-software-house/qctl"
readme = "README.md"
keywords = ["tasks", "ledger", "yaml", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.5", features = ["derive", "env"] }
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yml = "0.0.12"
time = { version = "0.3.44", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3.23.0"
