[package]
name = "qctl"
version = "0.6.0"
edition = "2024"
rust-version = "1.99.1"
description = "Control in-repo YAML work queues"
license = "MIT"
repository = "https://github.com/victor-software-house/qctl"
readme = "README.md"
keywords = ["tasks", "ledger", "yaml", "cli"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cap-lints", "warn"]

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A function that returns Result reports failure through it, not a panic.
panic_in_result_fn = "deny"
# map_err(|_| ...) drops the cause; wrap it as a source instead. A site whose
# error carries nothing carries #[expect(clippy::map_err_ignore, reason = "...")].
map_err_ignore = "deny"
# format! or push_str, not + on a String.
string_add = "deny"
# From and TryFrom, not as, which can silently truncate or wrap. A site that
# truly needs as carries #[expect(clippy::as_conversions, reason = "...")].
as_conversions = "deny"
# Rc<str> and Rc<[T]>, not Rc<String> or Rc<Vec<T>>.
rc_buffer = "deny"
# Rc::clone(&x), so a cheap pointer clone reads apart from a deep copy.
clone_on_ref_ptr = "deny"
# foo.rs beside foo/, never foo/mod.rs. The Rust Book calls the first the
# idiomatic path and mod.rs the older style, whose many same-named files blur
# together in an editor (ch07-05, "Alternate File Paths").
mod_module_files = "deny"
# A library logs through tracing or log; printing is the binary's choice.
print_stdout = "deny"
print_stderr = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.6", features = ["derive", "env"] }
ctl-core = { version = "=0.6.24", default-features = false, features = [
  "app",
  "input",
  "usage",
] }
garde = { version = "0.23.0", features = ["derive", "regex"] }
indoc = "2.0.7"
jsonschema = { version = "0.49.9", default-features = false }
regex = "1.13.1"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.44", features = ["formatting", "macros", "parsing"] }
yamled = "0.0.8"

[dev-dependencies]
ctl-core = { version = "=0.6.24", default-features = false, features = [
  "surface",
] }
insta = { version = "1.48.0", features = ["filters"] }
minijinja = { version = "=2.24.0", features = ["serde"] }
rstest = "0.26.1"
shlex = "2.0.1"
similar = "3.2.0"
tempfile = "3.23.0"
time = { version = "0.3.44", features = ["macros", "parsing"] }
