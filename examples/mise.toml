min_version = "2026.7.7"

[settings]
experimental = true
lockfile = true

# Served: rendered from .ctl/templates/mise.toml.jinja onto the Version PR
# commit, so the tag carries an example that installs itself. A verb added after
# the release you copy is not in that tarball yet — pin the release that carries
# the verb you copied.
[tools]
"github:victor-software-house/qctl" = "0.2.1"

[task_config]
includes = [
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=v0.2.1",
  "mise-tasks",
]
