# Cargo.lock carries the version too, so a bump leaves it stale. `after`
# regenerates it and `stage` puts it on the Version PR commit; without both,
# Verify's `cargo package --locked` fails on a dirty tree.
[prepare]
after = ["cargo", "update", "--workspace"]
stage = ["Cargo.lock"]

[[packages]]
name = "qctl"
path = "Cargo.toml"

# One table per host binary; the name is the job, the tarball, and the
# platform. Both are built-in records, so the runner labels, os, arch, and
# triple come from verctl — this repo is public, so those defaults are the
# free hosted runners it wants. PR CI never builds these.
[assets.darwin-arm64]

[assets.linux-x64]
