# CI already runs `mise run verify`. Do not arm hooks on runners.
pre-commit:
  skip:
    - run: test -n "$CI"
  commands:
    format:
      glob: "**/*.rs"
      run: mise run format

commit-msg:
  skip:
    - run: test -n "$CI"
  commands:
    committed:
      run: mise run commit-msg {1}

pre-push:
  skip:
    - run: test -n "$CI"
  commands:
    lockfile:
      run: mise install --locked
    committed:
      # Lint the commits each pushed ref carries that main lacks. Git
      # passes one `<local ref> <local sha> <remote ref> <remote sha>` line
      # per ref on stdin. A branch that merged main carries main's
      # commits, and squash merges land there without this hook, so a
      # range from the old remote sha would lint them too. Without
      # origin/main, the pushed commit is linted alone.
      use_stdin: true
      run: |
        zero=0000000000000000000000000000000000000000
        while read -r _ lsha _ _; do
          [ "$lsha" = "$zero" ] && continue
          if git rev-parse -q --verify origin/main >/dev/null; then
            range="origin/main..$lsha"
          else
            range="$lsha"
          fi
          mise run commits "$range" </dev/null || exit 1
        done
    verify:
      # Git exports GIT_DIR and friends to hooks. Tests that probe a scratch
      # directory with `git -C` would find this repository instead.
      run: unset $(git rev-parse --local-env-vars) && mise run verify
