# CI already runs `mise run verify`. Do not arm hooks on runners.
pre-commit:
  skip:
    - run: test -n "$CI"
  commands:
    format:
      glob: "**/*.rs"
      run: mise run format

commit-msg:
  skip:
    - run: test -n "$CI"
  commands:
    committed:
      run: mise run commit-msg {1}

pre-push:
  skip:
    - run: test -n "$CI"
  commands:
    lockfile:
      run: mise install --locked
    committed:
      # Every commit on the branch, not only the tip. @{upstream} does not
      # exist on a branch's first push.
      run: mise run commits origin/main..HEAD
    verify:
      # Git exports GIT_DIR and friends to hooks. Tests that probe a scratch
      # directory with `git -C` would find this repository instead.
      run: unset $(git rev-parse --local-env-vars) && mise run verify
