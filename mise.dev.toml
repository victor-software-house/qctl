# Loaded when MISE_ENV contains `dev` (local default via .miserc.toml).
# Compile this checkout. Not used by Version PR.

[tools]
# Components are explicit: a bare `rust = "1.97.1"` resolves without
# rustfmt or clippy on a clean runner, which local rustup hides.
rust = { version = "1.97.1", components = "rustfmt,clippy" }

[tasks.format]
description = "rustfmt check"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "clippy -D warnings"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Test suite"
run = "cargo test --all-features"

[tasks.verify]
description = "CI-safe gate: format, clippy, test"
depends = ["format", "lint", "test"]

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"
